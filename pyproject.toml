[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcmp-repro"
version = "0.2.1"
description = "Reproduction materials for PropGate: low-label medicinal plant recognition when unlabeled archives contain unknown species"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.11,<1.14", "scikit-learn==1.7.2", "joblib>=1.3,<2", "matplotlib>=3.7,<3.10", "Pillow>=10,<13", "threadpoolctl>=3.1"]

[project.optional-dependencies]
features = ["open_clip_torch>=2.32,<3", "huggingface_hub>=0.25,<1", "safetensors>=0.4,<1"]
revision = ["open_clip_torch>=2.32,<3", "huggingface_hub>=0.25,<1", "safetensors>=0.4,<1", "transformers>=4.40,<5"]

[tool.setuptools.packages.find]
where = ["src"]
