name: CPU reproduction checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e . "numpy==1.24.3" "scipy==1.11.2"
      - run: python scripts/run_offline_checks.py
